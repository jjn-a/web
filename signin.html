<!DOCTYPE html>

</head>
<body>

        </div>
    </div>

   <nav class="navbar">
  <div class="logo"> <a href="index.html"><img src="img/gymone (1).png" alt=""></a></div>

  <input type="checkbox" id="menu-toggle">

  <label for="menu-toggle" class="menu-icon">
    <span class="open">&#9776;</span>
    <span class="close">&times;</span>
  </label>
  
  <div class="menu-overlay" onclick="document.getElementById('menu-toggle').checked = false"></div>

  <ul class="navlinks">
    <li><a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Home</span>
    </a></li>
    <li><a href="offers.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
      <span>Offers</span>
    </a></li>
    <li><a href="about.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span>About</span>
    </a></li>
    <li><a href="contact.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      <span>Contact</span>
    </a></li>
    <li class="mobile-signin"><a class="active" href="signin.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
      <span>Sign In</span>
    </a></li>
  </ul>
  
  <ul class="nav-signin">
    <li><a class="active" href="signin.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
      <span>Sign In</span>
    </a></li>
  </ul>
</nav>
   <section id="auth" class="form-section">
        <div class="container">
            <form id="auth-form" class="signinform">
                <h2 id="form-title">Sign In</h2>
                
                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V21C3 22.11 3.89 23 5 23H19C20.11 23 21 22.11 21 21V9M19 9H14V4H19V9Z"/>
                    </svg>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
                
                
                <div class="input-group name-group" id="name-fields-group" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <input type="text" id="first_name" name="first_name" placeholder="First Name">
                </div>
                
                <div class="input-group name-group" id="lastname-fields-group" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <input type="text" id="last_name" name="last_name" placeholder="Surname">
                </div>
                
                <div class="input-group" id="email-group" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M20 4H4C2.89 4 2 4.89 2 6V18C2 19.11 2.89 20 4 20H20C21.11 20 22 19.11 22 18V6C22 4.89 21.11 4 20 4M20 18H4V8L12 13L20 8V18M20 6L12 11L4 6V6H20V6Z"/>
                    </svg>
                    <input type="email" id="email" name="email" placeholder="Email">
                </div>
                
                <div class="input-group">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1M10 17L6 13L7.41 11.59L10 14.17L16.59 7.58L18 9L10 17Z"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                  <div class="input-group" id="confirm-group" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1M10 17L6 13L7.41 11.59L10 14.17L16.59 7.58L18 9L10 17Z"/>
                    </svg>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password">
                </div>
                
                <button type="submit" id="submit-btn">Sign In</button>
                
                <div id="auth-message" class="auth-message inline" style="display: none;"></div>
                
                <p class="toggle-text">
                    <a href="#" id="toggle-link">Don't have an account? Sign Up.</a>
                </p>
            </form>
        </div>
    </section>

  <script src="script.js"></script> 
</body>
</html>
